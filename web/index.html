<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Go AI Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --surface2: #1c2128;
    --border: #30363d;
    --border2: #21262d;
    --text: #e6edf3;
    --text2: #8b949e;
    --text3: #656d76;
    --accent: #00d4aa;
    --accent2: #00b894;
    --accent-dim: rgba(0, 212, 170, 0.12);
    --accent-glow: rgba(0, 212, 170, 0.25);
    --blue: #58a6ff;
    --red: #f85149;
    --yellow: #d29922;
    --mono: 'JetBrains Mono', monospace;
    --sans: 'Space Grotesk', sans-serif;
    --radius: 8px;
    --radius2: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; font-family: var(--sans); background: var(--bg); color: var(--text); overflow: hidden; }

  /* Layout */
  .app { display: grid; grid-template-columns: 260px 1fr; height: 100vh; }

  /* Sidebar */
  .sidebar {
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .sidebar-header {
    padding: 20px 16px 12px;
    border-bottom: 1px solid var(--border2);
  }
  .logo {
    display: flex; align-items: center; gap: 10px;
    font-size: 15px; font-weight: 600; letter-spacing: -0.3px;
  }
  .logo-icon {
    width: 32px; height: 32px; border-radius: 8px;
    background: linear-gradient(135deg, var(--accent), #00b4d8);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; flex-shrink: 0;
  }
  .logo-sub { font-size: 11px; color: var(--text3); font-weight: 400; margin-top: 1px; }
  .new-chat-btn {
    margin: 12px 16px 0;
    display: flex; align-items: center; gap: 8px;
    background: var(--accent-dim); border: 1px solid var(--accent-glow);
    color: var(--accent); padding: 8px 14px; border-radius: var(--radius);
    font-size: 13px; font-family: var(--sans); font-weight: 500;
    cursor: pointer; transition: all .2s; width: calc(100% - 32px);
  }
  .new-chat-btn:hover { background: var(--accent-glow); border-color: var(--accent); }

  .sessions-label {
    padding: 16px 16px 6px;
    font-size: 11px; font-weight: 600; color: var(--text3);
    text-transform: uppercase; letter-spacing: 1px;
  }
  .sessions-list { flex: 1; overflow-y: auto; padding: 0 8px 16px; }
  .sessions-list::-webkit-scrollbar { width: 4px; }
  .sessions-list::-webkit-scrollbar-track { background: transparent; }
  .sessions-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .session-item {
    padding: 9px 10px; border-radius: 6px; cursor: pointer;
    transition: background .15s; position: relative;
    display: flex; align-items: center; gap: 8px;
  }
  .session-item:hover { background: var(--surface2); }
  .session-item.active { background: var(--accent-dim); }
  .session-item .session-icon { font-size: 13px; flex-shrink: 0; }
  .session-item .session-title {
    font-size: 12.5px; color: var(--text2); white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; flex: 1;
  }
  .session-item.active .session-title { color: var(--text); }
  .session-del {
    opacity: 0; font-size: 12px; color: var(--text3); padding: 2px 4px;
    border-radius: 4px; transition: all .15s; flex-shrink: 0;
    background: none; border: none; cursor: pointer;
  }
  .session-item:hover .session-del { opacity: 1; }
  .session-del:hover { color: var(--red); background: rgba(248,81,73,0.1); }

  .sidebar-footer {
    padding: 12px 16px;
    border-top: 1px solid var(--border2);
  }
  .status-dot {
    display: inline-block; width: 7px; height: 7px;
    border-radius: 50%; background: var(--text3); margin-right: 6px;
    transition: background .3s;
  }
  .status-dot.ok { background: var(--accent); box-shadow: 0 0 6px var(--accent-glow); }
  .status-dot.error { background: var(--red); }
  .status-text { font-size: 12px; color: var(--text3); }

  /* Main chat area */
  .main { display: flex; flex-direction: column; overflow: hidden; }

  .topbar {
    padding: 0 24px;
    height: 56px; display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--border2); flex-shrink: 0;
  }
  .topbar-title { font-size: 14px; font-weight: 500; color: var(--text2); }
  .model-badge {
    display: flex; align-items: center; gap: 6px;
    background: var(--surface2); border: 1px solid var(--border);
    padding: 5px 10px; border-radius: 20px; font-size: 12px; color: var(--text2);
    cursor: pointer; transition: all .2s;
  }
  .model-badge:hover { border-color: var(--accent); color: var(--text); }
  .model-select {
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--text); padding: 5px 8px; border-radius: 20px;
    font-size: 12px; font-family: var(--sans); outline: none; cursor: pointer;
  }
  .model-select:focus { border-color: var(--accent); }
  .model-select option { background: var(--surface2); }

  .messages {
    flex: 1; overflow-y: auto; padding: 24px;
    display: flex; flex-direction: column; gap: 20px;
  }
  .messages::-webkit-scrollbar { width: 6px; }
  .messages::-webkit-scrollbar-track { background: transparent; }
  .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* Welcome screen */
  .welcome {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 40px; text-align: center; gap: 32px;
  }
  .welcome-icon {
    width: 72px; height: 72px; border-radius: 18px;
    background: linear-gradient(135deg, var(--accent), #00b4d8);
    display: flex; align-items: center; justify-content: center;
    font-size: 36px;
    box-shadow: 0 0 40px var(--accent-glow);
  }
  .welcome h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; }
  .welcome p { font-size: 14px; color: var(--text2); max-width: 380px; line-height: 1.6; }
  .suggestions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; max-width: 520px; }
  .suggestion-card {
    background: var(--surface); border: 1px solid var(--border);
    padding: 14px 16px; border-radius: var(--radius2); cursor: pointer;
    text-align: left; transition: all .2s; font-family: var(--sans);
  }
  .suggestion-card:hover { border-color: var(--accent); background: var(--accent-dim); }
  .suggestion-card .s-icon { font-size: 18px; margin-bottom: 8px; }
  .suggestion-card .s-title { font-size: 13px; font-weight: 500; color: var(--text); }
  .suggestion-card .s-sub { font-size: 12px; color: var(--text3); margin-top: 3px; }

  /* Messages */
  .message { display: flex; gap: 12px; max-width: 860px; animation: fadeUp .2s ease; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .message.user { flex-direction: row-reverse; align-self: flex-end; }
  .avatar {
    width: 32px; height: 32px; border-radius: 8px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 14px;
  }
  .avatar.ai { background: linear-gradient(135deg, var(--accent), #00b4d8); }
  .avatar.user { background: var(--surface2); border: 1px solid var(--border); }
  .msg-content { flex: 1; }
  .msg-bubble {
    padding: 12px 16px; border-radius: var(--radius2);
    font-size: 14px; line-height: 1.65;
  }
  .message.user .msg-bubble {
    background: var(--accent-dim); border: 1px solid var(--accent-glow);
    color: var(--text); border-radius: 12px 4px 12px 12px;
  }
  .message.ai .msg-bubble {
    background: var(--surface); border: 1px solid var(--border2);
    border-radius: 4px 12px 12px 12px;
  }
  .msg-meta { font-size: 11px; color: var(--text3); margin-top: 5px; }
  .message.user .msg-meta { text-align: right; }

  /* Code blocks */
  .msg-bubble pre {
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 6px; padding: 14px; overflow-x: auto;
    margin: 10px 0; font-family: var(--mono); font-size: 12.5px;
    line-height: 1.6;
  }
  .msg-bubble code { font-family: var(--mono); font-size: 12.5px; }
  .msg-bubble p { margin-bottom: 8px; }
  .msg-bubble p:last-child { margin-bottom: 0; }
  .msg-bubble strong { color: var(--accent); font-weight: 600; }

  /* Typing indicator */
  .typing { display: flex; gap: 4px; padding: 4px 0; }
  .typing span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--text3); animation: blink 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: .2s; }
  .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink {
    0%, 80%, 100% { opacity: .3; transform: scale(.8); }
    40% { opacity: 1; transform: scale(1); }
  }

  /* Input area */
  .input-area {
    padding: 16px 24px 20px;
    border-top: 1px solid var(--border2); flex-shrink: 0;
  }
  .input-wrapper {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius2); transition: border-color .2s;
    display: flex; flex-direction: column;
  }
  .input-wrapper:focus-within { border-color: var(--accent); }
  .input-toolbar {
    padding: 8px 12px 0;
    display: flex; align-items: center; gap: 6px;
  }
  .toolbar-btn {
    background: none; border: none; padding: 4px 8px;
    border-radius: 4px; font-size: 11px; color: var(--text3);
    cursor: pointer; font-family: var(--sans);
    transition: all .15s; display: flex; align-items: center; gap: 4px;
  }
  .toolbar-btn:hover { background: var(--surface2); color: var(--text2); }
  .toolbar-btn.active { color: var(--accent); background: var(--accent-dim); }
  textarea {
    background: transparent; border: none; outline: none;
    color: var(--text); font-family: var(--sans); font-size: 14px;
    padding: 12px 16px 8px; resize: none; width: 100%;
    min-height: 52px; max-height: 200px; line-height: 1.6;
  }
  textarea::placeholder { color: var(--text3); }
  .input-bottom {
    padding: 6px 12px 10px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .char-count { font-size: 11px; color: var(--text3); font-family: var(--mono); }
  .send-btn {
    background: var(--accent); border: none; color: #000;
    padding: 7px 16px; border-radius: 6px; font-size: 13px;
    font-weight: 600; font-family: var(--sans); cursor: pointer;
    transition: all .2s; display: flex; align-items: center; gap: 6px;
  }
  .send-btn:hover { background: var(--accent2); transform: translateY(-1px); }
  .send-btn:disabled { background: var(--border); color: var(--text3); cursor: not-allowed; transform: none; }
  .send-btn.loading { background: var(--surface2); color: var(--text3); cursor: not-allowed; }

  .hint { font-size: 11px; color: var(--text3); margin-top: 8px; text-align: center; }
  kbd {
    background: var(--surface2); border: 1px solid var(--border);
    padding: 1px 5px; border-radius: 3px; font-family: var(--mono);
    font-size: 10px; color: var(--text2);
  }

  /* Token counter */
  .token-bar {
    display: flex; align-items: center; gap: 8px;
    padding: 4px 0; font-size: 11px; color: var(--text3);
  }
  .token-val { color: var(--accent); font-family: var(--mono); }
</style>
</head>
<body>
<div class="app">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <div class="logo-icon">⚡</div>
        <div>
          <div>Go AI Agent</div>
          <div class="logo-sub">Fiber · v1.0 · MVP</div>
        </div>
      </div>
    </div>
    <button class="new-chat-btn" onclick="newChat()">
      <span>＋</span> New conversation
    </button>
    <div class="sessions-label">Recent</div>
    <div class="sessions-list" id="sessionsList">
      <div style="padding: 12px 10px; font-size: 12px; color: var(--text3);">No conversations yet</div>
    </div>
    <div class="sidebar-footer">
      <span class="status-dot" id="statusDot"></span>
      <span class="status-text" id="statusText">Checking API...</span>
    </div>
  </aside>

  <!-- Main -->
  <main class="main">
    <div class="topbar">
      <div class="topbar-title" id="chatTitle">New conversation</div>
      <div style="display:flex;align-items:center;gap:10px;">
        <div id="tokenBar" class="token-bar" style="display:none;">
          <span>Tokens:</span>
          <span class="token-val" id="tokenCount">0</span>
        </div>
        <select class="model-select" id="modelSelect" onchange="onModelChange()">
          <option value="claude-sonnet-4-20250514">Claude Sonnet 4</option>
          <option value="claude-haiku-4-5-20251001">Claude Haiku 4.5</option>
          <option value="claude-opus-4-5">Claude Opus 4.5</option>
        </select>
      </div>
    </div>

    <div id="mainContent" style="flex:1;display:flex;flex-direction:column;overflow:hidden;">
      <!-- Welcome screen -->
      <div class="welcome" id="welcomeScreen">
        <div class="welcome-icon">⚡</div>
        <div>
          <h1>Go AI Agent</h1>
          <p>Your AI-powered backend development assistant. Ask anything about Go, Fiber, APIs, or backend architecture.</p>
        </div>
        <div class="suggestions">
          <button class="suggestion-card" onclick="sendSuggestion('Write a Fiber REST API handler with CRUD operations')">
            <div class="s-icon">🔧</div>
            <div class="s-title">CRUD handler</div>
            <div class="s-sub">Fiber REST API with full CRUD</div>
          </button>
          <button class="suggestion-card" onclick="sendSuggestion('Explain goroutines and channels with a practical example')">
            <div class="s-icon">⚙️</div>
            <div class="s-title">Goroutines</div>
            <div class="s-sub">Concurrency patterns in Go</div>
          </button>
          <button class="suggestion-card" onclick="sendSuggestion('How do I structure a Go microservice project?')">
            <div class="s-icon">🏗️</div>
            <div class="s-title">Project structure</div>
            <div class="s-sub">Microservice layout & patterns</div>
          </button>
          <button class="suggestion-card" onclick="sendSuggestion('Review this code for Go best practices:\n\nfunc getData(id string) (map[string]interface{}, error) {\n  db, _ := sql.Open(\"postgres\", dsn)\n  row := db.QueryRow(\"SELECT * FROM users WHERE id = \" + id)\n  // ...\n}')">
            <div class="s-icon">🔍</div>
            <div class="s-title">Code review</div>
            <div class="s-sub">Check Go best practices</div>
          </button>
        </div>
      </div>

      <!-- Messages -->
      <div class="messages" id="messages" style="display:none;"></div>
    </div>

    <!-- Input -->
    <div class="input-area">
      <div class="input-wrapper">
        <div class="input-toolbar">
          <button class="toolbar-btn" onclick="insertSnippet('```go\n\n```')" title="Insert code block">{ } Code</button>
          <button class="toolbar-btn" id="streamToggle" onclick="toggleStream()" title="Toggle streaming">⚡ Stream: ON</button>
          <button class="toolbar-btn" onclick="clearSystem()" id="sysBtn">🔧 System prompt</button>
        </div>
        <textarea
          id="messageInput"
          placeholder="Ask anything about Go backend development..."
          onkeydown="handleKey(event)"
          oninput="handleInput()"
          rows="1"
        ></textarea>
        <div class="input-bottom">
          <span class="char-count" id="charCount">0 chars</span>
          <button class="send-btn" id="sendBtn" onclick="sendMessage()">
            Send <span>↵</span>
          </button>
        </div>
      </div>
      <div class="hint"><kbd>Enter</kbd> to send · <kbd>Shift+Enter</kbd> for new line</div>
    </div>
  </main>
</div>

<!-- System prompt modal -->
<div id="sysModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;display:none;align-items:center;justify-content:center;">
  <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius2);padding:24px;width:480px;max-width:90vw;">
    <div style="font-size:14px;font-weight:600;margin-bottom:12px;">System Prompt</div>
    <textarea id="sysInput" rows="5" style="width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:10px;border-radius:var(--radius);font-family:var(--mono);font-size:12.5px;outline:none;resize:vertical;" placeholder="You are a helpful Go backend expert..."></textarea>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px;">
      <button onclick="closeSysModal()" style="background:var(--surface2);border:1px solid var(--border);color:var(--text2);padding:7px 16px;border-radius:6px;cursor:pointer;font-family:var(--sans);font-size:13px;">Cancel</button>
      <button onclick="saveSystem()" style="background:var(--accent);border:none;color:#000;padding:7px 16px;border-radius:6px;cursor:pointer;font-family:var(--sans);font-size:13px;font-weight:600;">Save</button>
    </div>
  </div>
</div>

<script>
const API = '/api/v1';
let currentSession = null;
let sessions = {};
let streaming = true;
let totalTokens = 0;
let systemPrompt = '';

// --- Init ---
async function init() {
  await checkHealth();
  await loadModels();
  autoResize(document.getElementById('messageInput'));
}

async function checkHealth() {
  try {
    const r = await fetch(`${API}/health`);
    const d = await r.json();
    const dot = document.getElementById('statusDot');
    const txt = document.getElementById('statusText');
    if (d.status === 'ok') {
      dot.className = 'status-dot ok';
      const apiStatus = d.services?.anthropic_api || 'unknown';
      txt.textContent = apiStatus === 'configured' ? 'API connected' : 'No API key';
      if (apiStatus !== 'configured') dot.className = 'status-dot error';
    }
  } catch {
    document.getElementById('statusDot').className = 'status-dot error';
    document.getElementById('statusText').textContent = 'Server offline';
  }
}

async function loadModels() {
  try {
    const r = await fetch(`${API}/models`);
    const d = await r.json();
    const sel = document.getElementById('modelSelect');
    sel.innerHTML = '';
    d.models.forEach(m => {
      const o = document.createElement('option');
      o.value = m.id;
      o.textContent = m.name;
      if (m.default) o.selected = true;
      sel.appendChild(o);
    });
  } catch {}
}

// --- Chat ---
async function sendMessage() {
  const input = document.getElementById('messageInput');
  const msg = input.value.trim();
  if (!msg || document.getElementById('sendBtn').disabled) return;

  input.value = '';
  handleInput();
  showMessages();
  addMessage('user', msg);

  setLoading(true);

  if (streaming) {
    await sendStream(msg);
  } else {
    await sendChat(msg);
  }

  setLoading(false);
}

async function sendChat(msg) {
  try {
    const r = await fetch(`${API}/agent/chat`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        message: msg,
        session_id: currentSession,
        model: document.getElementById('modelSelect').value,
        system_prompt: systemPrompt || undefined,
      })
    });
    const d = await r.json();
    if (d.error) throw new Error(d.message);

    currentSession = d.session_id;
    totalTokens += d.tokens || 0;
    updateTokenDisplay();

    addMessage('ai', d.content, `${d.duration_ms.toFixed(0)}ms · ${d.tokens} tokens`);
    updateSessions();
  } catch (e) {
    addMessage('ai', `⚠️ Error: ${e.message}`, null, true);
  }
}

async function sendStream(msg) {
  const aiDiv = addMessage('ai', '', null, false, true);
  const bubbleEl = aiDiv.querySelector('.msg-content-text');

  try {
    const r = await fetch(`${API}/agent/stream`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        message: msg,
        session_id: currentSession,
        model: document.getElementById('modelSelect').value,
        system_prompt: systemPrompt || undefined,
      })
    });

    const reader = r.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let fullContent = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();

      for (const line of lines) {
        if (line.startsWith('data: ')) {
          try {
            const chunk = JSON.parse(line.slice(6));
            if (chunk.type === 'delta' && chunk.content) {
              fullContent += chunk.content;
              bubbleEl.innerHTML = renderMarkdown(fullContent);
              scrollToBottom();
            }
            if (chunk.done) {
              updateSessions();
            }
          } catch {}
        }
      }
    }
  } catch (e) {
    bubbleEl.textContent = `⚠️ Stream error: ${e.message}`;
  }
}

function sendSuggestion(text) {
  document.getElementById('messageInput').value = text;
  handleInput();
  sendMessage();
}

// --- UI Helpers ---
function showMessages() {
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('messages').style.display = 'flex';
}

function addMessage(role, content, meta, isError = false, streaming = false) {
  const msgs = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = `message ${role}`;

  const avatar = role === 'user' ? '👤' : '⚡';
  const avatarClass = role === 'user' ? 'user' : 'ai';

  div.innerHTML = `
    <div class="avatar ${avatarClass}">${avatar}</div>
    <div class="msg-content">
      <div class="msg-bubble ${isError ? 'error-bubble' : ''}">
        ${streaming
          ? `<span class="msg-content-text"></span><span class="typing"><span></span><span></span><span></span></span>`
          : `<span class="msg-content-text">${renderMarkdown(content)}</span>`
        }
      </div>
      ${meta ? `<div class="msg-meta">${meta}</div>` : ''}
    </div>
  `;

  msgs.appendChild(div);
  scrollToBottom();
  return div;
}

function renderMarkdown(text) {
  // Basic markdown: code blocks, bold, inline code
  return text
    .replace(/```(\w+)?\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\n/g, '<br>');
}

function scrollToBottom() {
  const msgs = document.getElementById('messages');
  msgs.scrollTop = msgs.scrollHeight;
}

function setLoading(loading) {
  const btn = document.getElementById('sendBtn');
  btn.disabled = loading;
  btn.className = loading ? 'send-btn loading' : 'send-btn';
  btn.innerHTML = loading ? '<span class="typing"><span></span><span></span><span></span></span>' : 'Send <span>↵</span>';
}

function updateTokenDisplay() {
  if (totalTokens > 0) {
    document.getElementById('tokenBar').style.display = 'flex';
    document.getElementById('tokenCount').textContent = totalTokens.toLocaleString();
  }
}

async function updateSessions() {
  try {
    const r = await fetch(`${API}/agent/sessions`);
    const d = await r.json();
    renderSessions(d.sessions || []);
  } catch {}
}

function renderSessions(list) {
  const el = document.getElementById('sessionsList');
  if (!list.length) {
    el.innerHTML = '<div style="padding:12px 10px;font-size:12px;color:var(--text3);">No conversations yet</div>';
    return;
  }
  el.innerHTML = list.map(s => `
    <div class="session-item ${s.id === currentSession ? 'active' : ''}" onclick="loadSession('${s.id}')">
      <span class="session-icon">💬</span>
      <span class="session-title">${s.title || 'Conversation'}</span>
      <button class="session-del" onclick="deleteSession(event,'${s.id}')">✕</button>
    </div>
  `).join('');
}

async function loadSession(id) {
  try {
    const r = await fetch(`${API}/agent/sessions/${id}`);
    const sess = await r.json();
    currentSession = id;
    totalTokens = sess.total_tokens || 0;
    showMessages();
    document.getElementById('messages').innerHTML = '';
    document.getElementById('chatTitle').textContent = sess.title || 'Conversation';

    sess.messages.forEach(m => {
      addMessage(m.role === 'user' ? 'user' : 'ai', m.content);
    });
    updateTokenDisplay();
    updateSessions();
  } catch {}
}

async function deleteSession(e, id) {
  e.stopPropagation();
  await fetch(`${API}/agent/sessions/${id}`, { method: 'DELETE' });
  if (id === currentSession) newChat();
  updateSessions();
}

function newChat() {
  currentSession = null;
  totalTokens = 0;
  document.getElementById('messages').innerHTML = '';
  document.getElementById('messages').style.display = 'none';
  document.getElementById('welcomeScreen').style.display = 'flex';
  document.getElementById('chatTitle').textContent = 'New conversation';
  document.getElementById('tokenBar').style.display = 'none';
  updateSessions();
}

function onModelChange() {}

function toggleStream() {
  streaming = !streaming;
  const btn = document.getElementById('streamToggle');
  btn.textContent = `⚡ Stream: ${streaming ? 'ON' : 'OFF'}`;
  btn.className = `toolbar-btn ${streaming ? 'active' : ''}`;
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function handleInput() {
  const ta = document.getElementById('messageInput');
  const count = document.getElementById('charCount');
  ta.style.height = 'auto';
  ta.style.height = Math.min(ta.scrollHeight, 200) + 'px';
  count.textContent = ta.value.length + ' chars';
}

function autoResize(ta) {
  ta.addEventListener('input', () => handleInput());
}

function insertSnippet(text) {
  const ta = document.getElementById('messageInput');
  const pos = ta.selectionStart;
  ta.value = ta.value.slice(0, pos) + text + ta.value.slice(pos);
  ta.focus();
  ta.selectionStart = ta.selectionEnd = pos + text.indexOf('\n') + 1;
  handleInput();
}

function clearSystem() {
  document.getElementById('sysModal').style.display = 'flex';
  document.getElementById('sysInput').value = systemPrompt;
}

function closeSysModal() {
  document.getElementById('sysModal').style.display = 'none';
}

function saveSystem() {
  systemPrompt = document.getElementById('sysInput').value.trim();
  closeSysModal();
  const btn = document.getElementById('sysBtn');
  btn.className = `toolbar-btn ${systemPrompt ? 'active' : ''}`;
}

// Init on load
init();
</script>
</body>
</html>
